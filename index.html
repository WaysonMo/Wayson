<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>给谷亦萧的一封信</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Serif SC",serif;color:#4d4038}body{min-height:100vh;background:radial-gradient(circle at 20% 10%,#fff9f0,transparent 35%),radial-gradient(circle at 85% 90%,#d8c0a044,transparent 35%),#e8dccb}.cover{position:fixed;inset:12px;margin:auto;width:min(430px,calc(100% - 24px));height:min(680px,calc(100vh - 24px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f9eee2;background:linear-gradient(145deg,#815252,#5e3939);box-shadow:0 25px 60px #32231947;border-radius:8px}.cover:before{content:"";position:absolute;inset:18px;border:1px solid #fae6cd6b;border-radius:5px}.small{font:11px Arial,sans-serif;letter-spacing:5px;opacity:.75;margin-bottom:35px}.cover h1{font-size:42px;font-weight:400;letter-spacing:8px;margin:0}.sub{margin-top:25px;font-size:16px;letter-spacing:3px;opacity:.88}.open{margin-top:70px;padding:15px 34px;border-radius:30px;background:#f8ebdd;color:#694646;text-decoration:none;font-size:16px;box-shadow:0 8px 22px #1e140f2e}.letter-page{width:100%;min-height:100vh;padding:30px 12px 50px;display:flex;justify-content:center}.letter{position:relative;width:100%;max-width:760px;margin-top:15px;padding:52px 28px 55px;background:#fff8ea;border-radius:4px;box-shadow:0 20px 55px #4630233b;animation:unfold .9s cubic-bezier(.16,.9,.25,1)}.letter:before{content:"";position:absolute;inset:14px;border:1px solid #7e5b422e;pointer-events:none}.title{text-align:center;font-size:28px;font-weight:500;letter-spacing:5px;margin:0 0 35px}.content{font-size:16px;line-height:2;letter-spacing:.3px;position:relative;z-index:1}.content p{margin:0 0 19px}.content strong{color:#7a4545}.final{text-align:center;font-size:18px;margin-top:30px!important}.back{display:block;width:max-content;margin:0 auto 35px;padding:9px 18px;border-radius:20px;background:#fff8ea;color:#684e43;text-decoration:none;font-size:13px}@keyframes unfold{from{opacity:0;transform:perspective(1000px) rotateX(-75deg) translateY(-20px);transform-origin:top center}to{opacity:1;transform:perspective(1000px) rotateX(0) translateY(0)}}@media(max-width:600px){.cover{inset:12px;width:calc(100% - 24px);height:calc(100vh - 24px)}.cover h1{font-size:36px}.letter{padding:48px 22px 45px}.content{font-size:16px;line-height:1.95}}</style></head><body><section class="cover"><div class="small">A LETTER FOR YOU</div><h1>给谷亦萧</h1><div class="sub">有些话，我想认真说一次</div><a class="open" href="https://waysonmo.github.io/Wayson/letter.html" target="_self">打开道歉信</a></section></body></html>
